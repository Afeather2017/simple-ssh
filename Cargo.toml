[package]
name = "simple-ssh"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "process", "macros", "io-util", "io-std"] }
clap = { version = "4.5", features = ["derive"] }
strum = { version = "0.26", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
